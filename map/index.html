<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>우리 대학 제휴 업체 지도</title>
  <style>
    /* 지도가 화면에 보이려면 가로, 세로 크기가 꼭 있어야 합니다 */
    #map {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body>
  <h1>우리 대학 제휴 업체 지도</h1>
  
  <!-- 지도가 실제로 그려질 빈 공간 -->
  <div id="map"></div>

  <!-- 우리가 만든 자바스크립트 파일 연결 -->
  <script src="map.js"></script>
  
  <!-- 구글 지도 불러오기 (API 키 넣는 곳) -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCXNwAAXYslr8o2Dx2N1T2vBxOw63_Xlcc&libraries=places&callback=initMap">
  </script>
</body>
</html>
